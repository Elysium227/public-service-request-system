{% extends "base.html" %}
{% block content %}
<h2>Edit request {{ r.reference }}</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save changes</button>
</form>
<p><a href="{% url 'request_detail' r.pk %}">Back without saving</a></p>
{% endblock %}
