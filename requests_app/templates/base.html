<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Public Service Requests{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
    nav { background: #1f4e79; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font-size: 16px; cursor: pointer; }
    nav .brand { font-weight: bold; margin-right: auto; }
    nav form { margin: 0; }
    main { max-width: 700px; margin: 24px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'home' %}">Service Requests</a>
    <a href="{% url 'home' %}">Home</a>
    {% if user.is_authenticated %}
      <span style="color:#fff;">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
